name: Repository checks

on:
  push:
  pull_request:

concurrency:
  group: repository-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run repository sanity check
        run: python tools/repository_sanity_check.py

      - name: Compile Python sources
        run: python -m compileall -q analysis tools
